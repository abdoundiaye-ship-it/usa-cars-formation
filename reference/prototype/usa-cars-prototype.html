<title>USA CARS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: outil d'exploitation — barre latérale + espace de travail; bandeau "données fictives" en ruban de signalisation portuaire */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#E4EAEF; --fg:#13202C; --muted:#56687A; --line:#D2DBE3;
  --accent:#1B4F8F; --accent-soft:#DCE7F4; --accent-fg:#FFFFFF;
  --hazard:#F2C230; --hazard-ink:#1A1A12;
  --ok:#1D7A4C; --ok-soft:#DDF1E6; --warn:#A35F00; --warn-soft:#FBEBD2; --bad:#B0281F; --bad-soft:#F8DEDB;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#15202B; --surface-2:#1C2935; --fg:#E4EBF1; --muted:#90A2B4; --line:#2A3947;
  --accent:#78A9E8; --accent-soft:#1D3350; --accent-fg:#0D141B;
  --hazard:#E3B524; --hazard-ink:#14140C;
  --ok:#52C48C; --ok-soft:#17352A; --warn:#E6A645; --warn-soft:#3A2B12; --bad:#F2776C; --bad-soft:#3E1D1B;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#15202B; --surface-2:#1C2935; --fg:#E4EBF1; --muted:#90A2B4; --line:#2A3947;
  --accent:#78A9E8; --accent-soft:#1D3350; --accent-fg:#0D141B;
  --hazard:#E3B524; --hazard-ink:#14140C;
  --ok:#52C48C; --ok-soft:#17352A; --warn:#E6A645; --warn-soft:#3A2B12; --bad:#F2776C; --bad-soft:#3E1D1B;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---- Bandeau données fictives ---- */
.demo-strip{position:relative;z-index:30;display:flex;align-items:stretch;background:var(--hazard);color:var(--hazard-ink);font-size:12.5px;border-bottom:1px solid var(--hazard-ink)}
.demo-strip .tape{flex:0 0 28px;background:repeating-linear-gradient(-45deg,var(--hazard-ink) 0 7px,var(--hazard) 7px 14px)}
.demo-strip .txt{padding:6px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;min-width:0}
.demo-strip b{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase}

/* ---- Structure ---- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;padding:0 8px}
.brand .name{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1}
.brand .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:11px;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted);padding:0 6px;border-radius:9px}
.nav .count.alert{background:var(--bad-soft);color:var(--bad)}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.crumb{font-size:12px;color:var(--muted)}
.crumb button{all:unset;cursor:pointer;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* ---- Composants ---- */
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
a.btn{text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>header h2,.panel>header h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.panel .body{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.fake{background:var(--hazard);color:var(--hazard-ink);font-weight:600;letter-spacing:.05em;font-size:10px;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
.dl dt{color:var(--muted);font-size:12.5px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.note.warn{border-color:var(--warn)}

/* Stepper étapes */
.stepper{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:4px;overflow-x:auto;padding-bottom:2px}
.step{border-top:4px solid var(--line);padding:6px 4px 0;font-size:12px;color:var(--muted)}
.step b{display:block;font-weight:600;font-size:12.5px;color:var(--muted)}
.step.done{border-color:var(--ok)} .step.done b{color:var(--fg)}
.step.cur{border-color:var(--accent)} .step.cur b{color:var(--accent)}
.step.cur span{color:var(--fg)}

/* Chronologie */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:8px;padding-bottom:12px;position:relative}
.tl li::before{content:"";position:absolute;left:105px;top:14px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.tl .m{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;margin-left:2px}
.tl .m.manual{background:var(--surface);border:2px solid var(--accent)}
.tl .t{min-width:0}
.tl .t small{display:block;color:var(--muted);font-size:11.5px}

/* Barres */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar .fill.bad{background:var(--bad)}
.voyage{display:flex;flex-direction:column;gap:6px}
.voyage .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.voyage .track{height:6px;background:var(--surface-2);border-radius:3px;position:relative}
.voyage .fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 12px);border-radius:3px}

.alert-list{list-style:none;margin:0;padding:0}
.alert-list li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.alert-list li:hover{background:var(--surface-2)}
.alert-list li:last-child{border-bottom:0}
.alert-list .sev{align-self:stretch;border-radius:2px;background:var(--warn)}
.alert-list .sev.bad{background:var(--bad)} .alert-list .sev.info{background:var(--accent)}

.req{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.req li{display:flex;gap:8px;align-items:baseline}
.req .ic{font-weight:700;width:14px;flex:0 0 14px}
.req .ok{color:var(--ok)} .req .ko{color:var(--bad)}

/* Portail */
.portal-card{display:flex;flex-direction:column;gap:14px}
.vh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.vh h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em}
.track-box{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
a.ext{color:var(--accent);font-weight:500}

/* Modale & toast */
#modal{position:fixed;inset:0;z-index:50;background:rgb(8 14 20 / .55);display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top)) 16px 24px;overflow:auto}
[hidden],#modal[hidden]{display:none!important}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%;max-width:560px;box-shadow:0 18px 50px rgb(0 0 0 / .25)}
.dialog header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dialog header h2{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.02em}
.dialog .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font-size:12px;color:var(--muted)}
.f input,.f select{width:100%}
.check{display:flex;gap:8px;align-items:center}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
@media (prefers-reduced-motion:no-preference){#toast div{animation:t .2s ease-out}@keyframes t{from{transform:translateY(6px);opacity:.3}}}

/* Responsive */
@media (max-width:1100px){.grid-main{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap}
  .side .foot{display:none}
  .top{padding:12px 16px}
  #view{padding:16px 16px 40px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:96px minmax(0,1fr) 72px}
  .fg{grid-template-columns:minmax(0,1fr)}
}
</style>

function vDash(){

 const dues=act.reduce((s,x)=>s+Math.max(0,totals(x).bal),0);
 const overdue=act.filter(x=>x.due&&daysTo(x.due)<0&&totals(x).bal>0);
 const transit=S.data.containers.filter(c=>c.atd&&!c.ata);
 const al=alerts();
 const kp=`<div class="kpis">
  <div class="kpi"><span class="l">Dossiers actifs</span><span class="v">${act.length}</span><span class="s">${S.data.dossiers.length-act.length} clôturé(s)</span></div>
  <div class="kpi"><span class="l">Conteneurs en mer</span><span class="v">${transit.length}</span><span class="s">${S.data.containers.filter(c=>!c.atd).length} en préparation</span></div>
  ${r.seeFin?`<div class="kpi ${dues?'warn':''}"><span class="l">Soldes dus</span><span class="v">${money(dues)}</span><span class="s">sur ${act.filter(x=>totals(x).bal>0).length} dossiers</span></div>`:`<div class="kpi"><span class="l">À compléter</span><span class="v">${act.filter(x=>x.stage===0).length}</span><span class="s">dossiers en ouverture</span></div>`}
  <div class="kpi ${overdue.length?'bad':''}"><span class="l">Échéances dépassées</span><span class="v">${overdue.length}</span><span class="s">${al.filter(a=>a.txt.startsWith('Aucune')).length} dossier(s) sans mise à jour &gt; 7 j</span></div></div>`;
 const alertHtml=al.length?`<ul class="alert-list">${al.map(a=>`<li data-act="${a.x?'open':'openC'}" data-id="${a.x?a.x.id:a.c.id}"><span class="sev ${a.sev}"></span><div><span class="mono">${esc(a.x?a.x.id:a.c.id)}</span> · ${a.x?esc(client(a.x.client).name)+' · '+esc(a.x.v.make+' '+a.x.v.model):'Conteneur '+esc(carrier(a.c.carrier).name)}<div class="muted">${a.txt}</div></div><span class="muted">›</span></li>`).join('')}</ul>`:'<div class="body empty">Rien à signaler.</div>';
 const max=Math.max(...STAGES.map((s,i)=>S.data.dossiers.filter(x=>x.stage===i).length),1);
 const pipe=`<div class="bars">${STAGES.map((s,i)=>{const n=S.data.dossiers.filter(x=>x.stage===i).length;return `<div class="bar"><span>${s.label}</span><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div><span class="num">${n}</span></div>`}).join('')}</div>`;
 const cards=S.data.containers.map(c=>contSummary(c,true)).join('');
 return `${kp}
 <div class="grid-main"><section class="panel"><header><h2>À traiter</h2><span class="muted">${al.length} alerte(s)</span></header>${alertHtml}</section>
 <div class="stack"><section class="panel"><header><h2>Dossiers par étape</h2></header><div class="body">${pipe}</div></section></div></div>
 <section class="panel"><header><h2>Conteneurs</h2><span class="note">Progression calculée entre la date de départ et l’ETA. Ce n’est pas une position GPS.</span></header><div class="body"><div class="grid2">${cards}</div></div></section>`;
}
function voyageBar(c){
 if(!c.atd)return `<div class="voyage"><div class="ends"><span>${esc(c.pol)}</span><span>Départ prévu ${fmtD(c.etd)}</span></div><div class="track"></div></div>`;
 const end=c.ata||c.eta;const tot=(new Date(end)-new Date(c.atd))||1;const p=c.ata?100:Math.max(0,Math.min(100,(TODAY-new Date(c.atd+'T12:00:00'))/tot*100));

}

}

 csv:ds=>{const r=R();const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let rows=[];
  if(ds.k==='dossiers')rows=[['Référence','Client','Véhicule','VIN','Étape','Statut','Conteneur','Total USD','Payé USD','Solde USD','Échéance']].concat(S.data.dossiers.map(x=>{const t=totals(x);return[x.id,client(x.client).name,x.v.year+' '+x.v.make+' '+x.v.model,x.v.vin,STAGES[x.stage].label,x.status,x.container||'',t.cur,t.paid,t.bal,x.due||'']}));
  if(ds.k==='paiements')rows=[['Date','Dossier','Client','Mode','Référence','Montant USD','Validé par']].concat(S.data.dossiers.flatMap(x=>x.pays.map(p=>[p.date,x.id,client(x.client).name,p.mode,p.ref,p.amount,p.validator])));
  if(ds.k==='creances')rows=[['Dossier','Client','Solde USD','Échéance','Jours restants']].concat(S.data.dossiers.filter(x=>totals(x).bal>0).map(x=>[x.id,client(x.client).name,totals(x).bal,x.due||'',x.due?daysTo(x.due):'']));
  if(ds.k==='conteneurs')rows=[['Conteneur','Transporteur','B/L','Navire','Voyage','POL','POD','ETD','ATD','ETA','ATA','Dernière vérification']].concat(S.data.containers.map(c=>[c.id,carrier(c.carrier).name,c.bl,c.vessel,c.voyage,c.pol,c.pod,c.etd,c.atd||'',c.eta,c.ata||'',c.lastCheck]));
  const txt='# DONNÉES FICTIVES — prototype USA CARS\n'+rows.map(r=>r.map(q).join(';')).join('\n');
  log('Export CSV',ds.k,rows.length-1+' lignes · rôle '+r.label);save();
  openModal('Export CSV · '+ds.k,`<div class="note">Copiez ce contenu dans un fichier .csv (séparateur « ; », ouvrable dans Excel). En production, l’export sera un téléchargement direct.</div><textarea id="csvOut" rows="12" readonly class="mono" style="font-size:12px">${esc(txt)}</textarea><div><button type="button" class="btn" data-act="copyCsv">Copier</button></div>`,'noop',null)},
 copyCsv:()=>{const ta=document.getElementById('csvOut');const ok=()=>toast('Copié');navigator.clipboard?navigator.clipboard.writeText(ta.value).then(ok,()=>{ta.select();toast('Sélectionné — Ctrl/Cmd+C pour copier')}):(ta.select())},

const FORMS={
 force:fd=>{const x=dossier(ctx.id);closeModal();advance(x,fd.get('reason'))},
 newDossier:fd=>{const D=S.data;const n=D.seq++;const id='DEMO-2026-0'+n;const vin=(fd.get('vin')||'').trim().toUpperCase();
  const c=COST_TYPES.map((t,i)=>({t,est:+fd.get('c'+i)||0,real:null,history:[]}));
  const x={id,client:fd.get('client'),v:{make:fd.get('make'),model:fd.get('model'),year:+fd.get('year'),vin,lot:fd.get('lot'),platform:fd.get('platform'),cond:fd.get('cond'),color:'—'},stage:0,status:vin.length===17?'Nouveau':'Informations à compléter',owner:me(),created:todayISO(),purchased:null,updated:todayISO(),container:null,due:d(14),costs:c,pays:[],docs:[],notes:[],timeline:[{date:todayISO(),text:'Dossier ouvert',by:me()}]};
  D.dossiers.push(x);log('Dossier créé',id,client(x.client).name+' · '+x.v.make+' '+x.v.model+' · acquisition saisie '+money(c.slice(0,ACQ_LINES).reduce((s,k)=>s+k.est,0))+' · total estimé '+money(c.reduce((s,k)=>s+k.est,0)));save();closeModal();S.view='dossier';S.sel=id;render();toast('Dossier '+id+' créé')},
 editVehicle:fd=>{const x=dossier(ctx.id);const old=x.v.vin;x.v.vin=fd.get('vin').toUpperCase();x.v.lot=fd.get('lot');x.v.cond=fd.get('cond');if(x.status==='Informations à compléter')x.status='Validation requise';touch(x,'Informations véhicule complétées');log('Véhicule modifié',x.id,'VIN '+(old||'—')+' → '+x.v.vin);save();closeModal();render()},
 addDoc:fd=>{const x=dossier(ctx.id);const type=fd.get('type');const f=fd.get('file');const ver=x.docs.filter(k=>k.type===type).length+1;const name=(f&&f.name)||type.toLowerCase().replace(/[^a-z0-9]+/g,'_')+(ver>1?'_v'+ver:'')+'.pdf';
  x.docs.push({id:uid('D'),type,name,version:ver,date:todayISO(),client:fd.get('client')==='on'});touch(x,'Document ajouté : '+type+(ver>1?' (v'+ver+')':''));log('Document ajouté',x.id,type+' v'+ver+' · '+(fd.get('client')==='on'?'visible client':'interne'));save();closeModal();render();toast(type+' ajouté')},
 addNote:fd=>{const x=dossier(ctx.id);x.notes.unshift({date:todayISO(),by:me(),text:fd.get('text')});x.updated=todayISO();log('Note ajoutée',x.id,'');save();closeModal();render()},
 addPay:fd=>{const x=dossier(ctx.id);const amt=+fd.get('amount');const f=fd.get('proof');const p={id:uid('P'),amount:amt,date:fd.get('date'),mode:fd.get('mode'),ref:fd.get('ref'),validator:me(),proof:(f&&f.name)||'(aucun justificatif)'};x.pays.push(p);
  if(!x.docs.some(k=>k.type==='Preuve de paiement'&&k.name===p.proof)&&f&&f.name)x.docs.push({id:uid('D'),type:'Preuve de paiement',name:f.name,version:1,date:todayISO(),client:true});
  const t=totals(x);touch(x,'Paiement reçu : '+money(amt)+' ('+p.mode+')');if(x.stage===1&&x.status==='Paiement attendu'&&t.paid>=t.acq)x.status='Confirmé';if(x.stage===5&&x.status==='Solde attendu'&&t.bal<=0)x.status='Documents à finaliser';
  log('Paiement enregistré',x.id,money(amt)+' · '+p.mode+' · '+p.ref+' · nouveau solde '+money(t.bal));notify(x,'Confirmation de paiement');save();closeModal();render();toast('Paiement enregistré · solde '+money(Math.max(0,t.bal)))},
 editCost:fd=>{const x=dossier(ctx.id);const k=x.costs[ctx.i];const est=+fd.get('est');const rv=fd.get('val');const real=rv===''?null:+rv;const parts=[];
  if(est!==k.est)parts.push('estimé '+money(k.est)+' → '+money(est));if(real!==k.real)parts.push('réel '+(k.real==null?'—':money(k.real))+' → '+(real==null?'—':money(real)));
  if(!parts.length){closeModal();return}k.history.push({date:todayISO(),est:[k.est,est],real:[k.real,real],by:me()});k.est=est;k.real=real;touch(x);log('Coût modifié',x.id,k.t+' : '+parts.join(' ; '));save();closeModal();render()},
 newCont:fd=>{const id=fd.get('id').toUpperCase();if(cont(id)){toast('Ce conteneur existe déjà');return}const c={id,carrier:fd.get('carrier'),bl:fd.get('bl'),vessel:fd.get('vessel'),voyage:fd.get('voyage'),pol:fd.get('pol'),pod:'Dakar (SNDKR)',ts:'',etd:fd.get('etd'),atd:null,eta:fd.get('eta'),ata:null,status:'Chargement planifié',lastCheck:todayISO(),notes:'',etaHistory:[{date:todayISO(),eta:fd.get('eta'),source:'Saisie manuelle',by:me()}],events:[{date:todayISO(),loc:fd.get('pol'),desc:'Conteneur créé dans le système',source:'Saisie manuelle'}]};
  S.data.containers.push(c);log('Conteneur créé',id,carrier(c.carrier).name+' · '+c.vessel+' / '+c.voyage);save();closeModal();S.view='conteneur';S.sel=id;render()},
 eta:fd=>{const c=cont(ctx.id);const old=c.eta;const n=fd.get('eta');if(n===old){closeModal();return}c.eta=n;c.lastCheck=todayISO();c.etaHistory.push({date:todayISO(),eta:n,source:fd.get('source'),by:me()});c.events.push({date:todayISO(),loc:'—',desc:'ETA révisée : '+fmtD(old)+' → '+fmtD(n),source:'Saisie manuelle'});log('ETA modifiée',c.id,old+' → '+n);
  let k=0;if(fd.get('notify')==='on')S.data.dossiers.filter(x=>x.container===c.id).forEach(x=>{notify(x,'Changement d’ETA');touch(x,'ETA révisée au '+fmtD(n));k++});save();closeModal();render();toast('ETA mise à jour'+(k?' · '+k+' client(s) notifié(s) (simulé)':''))},
 addEvt:fd=>{const c=cont(ctx.id);c.events.push({date:fd.get('date'),loc:fd.get('loc'),desc:fd.get('desc'),source:'Saisie manuelle'});c.lastCheck=todayISO();log('Événement ajouté',c.id,fd.get('desc'));save();closeModal();render()},
 ata:fd=>{const c=cont(ctx.id);c.ata=fd.get('ata');c.status='Arrivé';c.lastCheck=todayISO();c.events.push({date:c.ata,loc:c.pod,desc:'Arrivée du navire (ATA)',source:'Saisie manuelle'});log('Arrivée réelle saisie',c.id,'ATA '+c.ata);
  S.data.dossiers.filter(x=>x.container===c.id).forEach(x=>{if(x.stage===4){x.status='Arrivé';x.arrived=c.ata;touch(x,'Navire arrivé à Dakar')}notify(x,'Arrivée à Dakar','WhatsApp')});save();closeModal();render();toast('Arrivée enregistrée · clients notifiés (simulé)')},
 newCarrier:fd=>{const name=fd.get('name').trim();S.data.carriers.push({id:uid('k'),name,url:fd.get('url'),template:fd.get('template'),mode:'Lien officiel',api:'Non étudiée'});log('Transporteur ajouté',name,fd.get('url')||'');save();closeModal();render()},
 reset:()=>{try{localStorage.removeItem(STORE_KEY)}catch(e){}S.data=seed();S.view='dash';closeModal();render();toast('Démo réinitialisée')},
 fx:fd=>{const fx=S.data.fx;const old=fx.rate;fx.rate=+fd.get('rate');fx.date=fd.get('date');fx.by=me();fx.source='XE.com — taux moyen du marché';fx.history.push({rate:fx.rate,date:fx.date,by:fx.by});log('Taux de change mis à jour','USD/XOF',nfRate.format(old)+' → '+nfRate.format(fx.rate)+' · source XE.com');save();closeModal();render();toast('Taux enregistré : 1 USD = '+nfRate.format(fx.rate)+' XOF')},
 noop:()=>closeModal(),
};

/* ================= Événements ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const fn=FORMS[f.dataset.form];if(fn)fn(new FormData(f),f)});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.chg;if(!k)return;
 if(k==='role'){S.role=el.value;S.view=ROLES[S.role].views[0];S.sel=null;save();render();toast('Vue : '+ROLES[S.role].label)}
 else if(k==='client'){S.clientView=el.value;save();render()}
 else if(k==='cur'){S.cur=el.value;save();render()}
 else if(k==='stageF'){S.stageF=el.value;document.getElementById('dlist').innerHTML=dossierRows()}
 else if(k==='finF'||k==='docF'){S[k]=el.value;render()}
 else if(k==='status'){const x=dossier(el.dataset.id);const old=x.status;x.status=el.value;touch(x,'Statut : '+old+' → '+x.status);log('Statut modifié',x.id,old+' → '+x.status);save();render();toast('Statut mis à jour')}
});
document.addEventListener('input',e=>{const k=e.target.dataset.inp;if(!k)return;S[k]=e.target.value;if(k==='q')document.getElementById('dlist').innerHTML=dossierRows();if(k==='auditQ'){const tmp=document.createElement('div');tmp.innerHTML=vAudit();document.getElementById('auditList').innerHTML=tmp.querySelector('#auditList').innerHTML}});

load();render();
</script>
